<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilingual Tutor & Editor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-200">
        <!-- Header -->
        <div class="bg-blue-700 text-white p-6">
            <h1 class="text-3xl font-bold">Bilingual Tutor & Editor</h1>
            <p class="text-blue-100 mt-2">Hệ thống sửa lỗi chính tả tiếng Việt & ngữ pháp tiếng Anh tự động</p>
        </div>

        <!-- Main Content -->
        <div class="p-6">
            <label for="userInput" class="block text-sm font-semibold text-gray-700 mb-2">Văn bản cần kiểm tra:</label>
            <textarea id="userInput" rows="6" 
                class="w-full p-4 border border-gray-300 rounded-lg focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition outline-none resize-none text-gray-800" 
                placeholder="Nhập hoặc dán văn bản của bạn vào đây..."></textarea>
            
            <button id="checkBtn" 
                class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300 flex justify-center items-center">
                <span>Phân tích & Chỉnh sửa</span>
            </button>

            <!-- Loading State -->
            <div id="loading" class="hidden mt-6 flex justify-center items-center space-x-2 text-blue-600">
                <svg class="animate-spin h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="font-medium">Hệ thống AI đang xử lý...</span>
            </div>
            
            <!-- Result Box -->
            <div id="resultBox" class="hidden mt-6 bg-green-50 border-l-4 border-green-500 p-5 rounded-r-lg shadow-inner">
                <h2 class="font-bold text-green-800 mb-3 text-lg">Kết quả từ Trợ lý:</h2>
                <div id="aiOutput" class="text-gray-800 whitespace-pre-wrap leading-relaxed"></div>
            </div>
        </div>
    </div>

    <!-- Script kết hợp Apps Script và Firebase Realtime Database -->
    <script type="module">
        // 1. Khởi tạo Firebase SDK v10
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Thay thế bằng cấu hình Firebase của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyCuZ1mWP9HucJ7KmPXDcBOU84pSa5d-iQU",
            authDomain: "register-app-e6411.firebaseapp.com",
            projectId: "register-app-e6411",
            storageBucket: "register-app-e6411.firebasestorage.app",
            messagingSenderId: "156977082805",
            appId: "1:156977082805:web:de09ae118026fbcdd1a9fc",
            measurementId: "G-7TVJL3MJEV"
        };


        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 2. URL của Google Apps Script Web App
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbygvdeymnL6CQQb5lJNouqS9luJ4vp05mdVvRE-FqHGADQmV4RU89YUuDevBXi9IQ5PQg/exec';
        
        // 3. Xử lý sự kiện UI
        const checkBtn = document.getElementById('checkBtn');
        const userInput = document.getElementById('userInput');
        const loading = document.getElementById('loading');
        const resultBox = document.getElementById('resultBox');
        const aiOutput = document.getElementById('aiOutput');

        checkBtn.addEventListener('click', async () => {
            const text = userInput.value.trim();
            if (!text) {
                alert('Vui lòng nhập văn bản trước khi phân tích!');
                return;
            }

            loading.classList.remove('hidden');
            resultBox.classList.add('hidden');
            checkBtn.disabled = true;
            checkBtn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                // SỬA ĐỔI TẠI ĐÂY: Chuyển sang phương thức GET
                // Mã hóa đoạn văn bản và gắn vào cuối URL
                const fetchUrl = `${GAS_WEB_APP_URL}?message=${encodeURIComponent(text)}`;
                
                const response = await fetch(fetchUrl, {
                    method: 'GET'
                });
                
                const data = await response.json();
                const resultText = data.result || data.error;

                aiOutput.innerText = resultText;
                resultBox.classList.remove('hidden');
                
                // Lưu trữ vào Firebase Realtime Database (Nút 'tutor_history')
                const historyRef = ref(db, 'tutor_history');
                await push(historyRef, {
                    original_text: text,
                    corrected_text: resultText,
                    timestamp: serverTimestamp()
                });
                
            } catch (error) {
                console.error("Lỗi kết nối:", error);
                alert('Có lỗi xảy ra trong quá trình xử lý hoặc kết nối máy chủ.');
            } finally {
                // Khôi phục giao diện
                loading.classList.add('hidden');
                checkBtn.disabled = false;
                checkBtn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
